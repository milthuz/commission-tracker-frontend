<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/saleshub-favicon-16.png?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/saleshub-favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="48x48" href="/saleshub-favicon-48.png?v=4" />
    <link rel="apple-touch-icon" href="/saleshub-apple-touch-icon-180.png?v=4" />
    <link rel="manifest" href="/site.webmanifest?v=4" />
    <meta name="theme-color" content="#141414" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sales Hub</title>
  </head>
  <body>
    <!--
      Thème posé AVANT le premier affichage, sur <html> (jamais le body), pour éviter le flash
      clair en thème sombre. Même règle que readTheme() dans src/lib/theme.ts — les garder
      identiques : clé `theme` ('dark' | 'light'), sinon les deux anciennes clés (`darkMode`
      'true'/'false', `color-theme` en JSON), sinon la préférence du système.
    -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'dark' && t !== 'light') {
          var a = localStorage.getItem('darkMode'), b = localStorage.getItem('color-theme');
          t = a !== null ? (a === 'true' ? 'dark' : 'light')
            : b !== null ? (JSON.parse(b) === 'dark' ? 'dark' : 'light')
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
